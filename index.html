<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Pet</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f7f1eb;
    color:#332a24;
}

.container{
    max-width:500px;
    margin:auto;
    padding:18px;
}

/* TOP BAR */
.top-bar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.back-button{
    border:1px solid #e0d4ca;
    background:white;
    color:#332a24;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.language-select{
    border:1px solid #e0d4ca;
    background:white;
    color:#332a24;
    padding:8px 10px;
    border-radius:10px;
    font-size:13px;
    outline:none;
}

/* HEADER */
.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:5px 0;
    font-size:30px;
}

.header p{
    margin:0;
    font-size:14px;
    color:#75685e;
}

/* CARD */
.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(76,48,29,.08);
    margin-bottom:18px;
}

.card h2{
    margin-top:0;
    font-size:21px;
}

/* FORM */
label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd0c5;
    border-radius:10px;
    font-size:15px;
    background:white;
    color:#222;
    outline:none;
}

input:focus,
select:focus{
    border-color:#8d6e58;
}

/* BUTTON */
button{
    width:100%;
    border:0;
    padding:13px;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:14px;
}

.primary{
    background:#332a24;
    color:white;
}

.secondary{
    background:#eee5dd;
    color:#332a24;
}

.call-btn{
    background:#e9f5e9;
    color:#205c28;
}

.whatsapp-btn{
    background:#e4f6e8;
    color:#176b2a;
}

.hidden{
    display:none !important;
}

/* QR */
.qr-area{
    text-align:center;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin:20px 0;
}

.pet-info{
    background:#faf7f4;
    border-radius:14px;
    padding:15px;
    text-align:left;
}

.pet-info p{
    margin:8px 0;
}

/* FOUND PET */
.found-title{
    text-align:center;
    font-size:23px;
    margin-bottom:15px;
}

.info-row{
    padding:9px 0;
    border-bottom:1px solid #eee5df;
}

.info-row:last-child{
    border-bottom:0;
}

/* MESSAGE */
.message{
    text-align:center;
    font-size:14px;
    margin-top:10px;
    color:#76695f;
}

/* RTL */
[dir="rtl"]{
    text-align:right;
}

[dir="rtl"] .pet-info{
    text-align:right;
}

[dir="rtl"] .top-bar{
    flex-direction:row-reverse;
}
</style>
</head>

<body>

<div class="container">

    <!-- TOP BAR -->
    <div class="top-bar">

        <!-- BACK: TOP LEFT -->
        <button
            class="back-button"
            id="backButton"
            onclick="backToMenu()">
            ← Back
        </button>

        <!-- LANGUAGE: TOP RIGHT -->
        <select
            class="language-select"
            id="languageSelect"
            onchange="changeLanguage()">

            <option value="en">English</option>
            <option value="ur">اردو</option>
            <option value="ar">العربية</option>
            <option value="ru">Русский</option>
            <option value="ky">Кыргызча</option>

        </select>

    </div>

    <!-- HEADER -->
    <div class="header">
        <h1>🐾 Find My Pet</h1>

        <p id="subtitle">
            Register your pet and attach the QR code to its collar.
        </p>
    </div>


    <!-- REGISTRATION -->
    <div class="card" id="registrationSection">

        <h2 id="registerTitle">Register Your Pet</h2>

        <label id="petTypeLabel">Pet Type</label>

        <select id="petType">
            <option value="Cat">Cat</option>
            <option value="Dog">Dog</option>
            <option value="Rabbit">Rabbit</option>
            <option value="Bird">Bird</option>
            <option value="Other Pet">Other Pet</option>
        </select>


        <label id="petNameLabel">Pet Name</label>

        <input
            type="text"
            id="petName"
            placeholder="Enter pet name">


        <label id="ownerNameLabel">Owner Name</label>

        <input
            type="text"
            id="ownerName"
            placeholder="Enter owner name">


        <label id="callNumberLabel">Normal SIM / Call Number</label>

        <input
            type="tel"
            id="callNumber"
            placeholder="Enter number for calls">


        <label id="whatsappNumberLabel">WhatsApp Number</label>

        <input
            type="tel"
            id="whatsappNumber"
            placeholder="Enter WhatsApp number">


        <label id="colorLabel">Pet Color</label>

        <input
            type="text"
            id="petColor"
            placeholder="Enter pet color">


        <button
            class="primary"
            onclick="registerPet()"
            id="registerButton">
            Register Pet
        </button>

        <p class="message" id="registerMessage"></p>

    </div>


    <!-- SEARCH -->
    <div class="card" id="searchSection">

        <h2 id="searchTitle">Find a Pet</h2>

        <label id="searchIdLabel">Enter Pet ID</label>

        <input
            type="text"
            id="searchId"
            placeholder="Example: FMP-001">

        <button
            class="secondary"
            onclick="findPet()"
            id="searchButton">
            Search Pet
        </button>

        <p class="message" id="searchMessage"></p>

    </div>


    <!-- QR SCREEN -->
    <div class="card hidden" id="qrSection">

        <div class="qr-area">

            <h2 id="qrTitle">Pet Registered Successfully!</h2>

            <p id="petIdDisplay"></p>

            <div id="qrcode"></div>

            <div class="pet-info" id="registeredInfo"></div>

            <button
                class="primary"
                onclick="saveInformation()"
                id="saveInfoButton">
                💾 Save Information
            </button>

            <button
                class="secondary"
                onclick="saveQRToGallery()"
                id="saveQRButton">
                🖼️ Save QR to Gallery
            </button>

            <button
                class="secondary"
                onclick="printQR()"
                id="printQRButton">
                🖨️ Print QR
            </button>

            <button
                class="primary"
                onclick="backToMenu()"
                id="registerAnotherButton">
                + Register Another Pet
            </button>

        </div>

    </div>


    <!-- FOUND PET -->
    <div class="card hidden" id="foundSection">

        <h2
            class="found-title"
            id="foundTitle">
            🐾 Pet Found
        </h2>

        <div
            class="pet-info"
            id="foundInfo">
        </div>

        <button
            class="call-btn"
            onclick="callOwner()"
            id="callOwnerButton">
            📞 Call Owner
        </button>

        <button
            class="whatsapp-btn"
            onclick="whatsappOwner()"
            id="whatsappOwnerButton">
            💬 WhatsApp Owner
        </button>

        <button
            class="secondary"
            onclick="backToMenu()"
            id="backFoundButton">
            ← Back
        </button>

    </div>

</div>

/* =========================
   LANGUAGE CHANGE
========================= */

function changeLanguage(){

    const lang =
        document.getElementById("languageSelect").value;

    const t = translations[lang];

    document.documentElement.lang = lang;

    if(lang === "ur" || lang === "ar" || lang === "ky"){
        document.documentElement.dir = "rtl";
    }else{
        document.documentElement.dir = "ltr";
    }

    document.getElementById("backButton").textContent = t.back;

    document.getElementById("subtitle").textContent = t.subtitle;

    document.getElementById("registerTitle").textContent = t.registerTitle;
    document.getElementById("petTypeLabel").textContent = t.petType;
    document.getElementById("petNameLabel").textContent = t.petName;
    document.getElementById("ownerNameLabel").textContent = t.ownerName;
    document.getElementById("callNumberLabel").textContent = t.callNumber;
    document.getElementById("whatsappNumberLabel").textContent = t.whatsappNumber;
    document.getElementById("colorLabel").textContent = t.color;

    document.getElementById("registerButton").textContent = t.register;

    document.getElementById("searchTitle").textContent = t.searchTitle;
    document.getElementById("searchIdLabel").textContent = t.searchId;
    document.getElementById("searchButton").textContent = t.search;

    document.getElementById("qrTitle").textContent = t.qrTitle;
    document.getElementById("saveInfoButton").textContent = t.saveInfo;
    document.getElementById("saveQRButton").textContent = t.saveQR;
    document.getElementById("printQRButton").textContent = t.printQR;
    document.getElementById("registerAnotherButton").textContent = t.registerAnother;

    document.getElementById("foundTitle").textContent = t.found;
    document.getElementById("callOwnerButton").textContent = t.callOwner;
    document.getElementById("whatsappOwnerButton").textContent = t.whatsappOwner;
    document.getElementById("backFoundButton").textContent = t.back;

    document.getElementById("petType").options[0].text = t.cat;
    document.getElementById("petType").options[1].text = t.dog;
    document.getElementById("petType").options[2].text = t.rabbit;
    document.getElementById("petType").options[3].text = t.bird;
    document.getElementById("petType").options[4].text = t.other;
}


/* =========================
   PET ID
========================= */

function generatePetID(){

    let number =
        parseInt(localStorage.getItem("fmpLastID") || "0") + 1;

    localStorage.setItem("fmpLastID", number);

    return "FMP-" + String(number).padStart(3,"0");
}


/* =========================
   REGISTER PET
========================= */

function registerPet(){

    const petType =
        document.getElementById("petType").value;

    const petName =
        document.getElementById("petName").value.trim();

    const ownerName =
        document.getElementById("ownerName").value.trim();

    const callNumber =
        document.getElementById("callNumber").value.trim();

    const whatsappNumber =
        document.getElementById("whatsappNumber").value.trim();

    const color =
        document.getElementById("petColor").value.trim();

    if(
        !petName ||
        !ownerName ||
        !callNumber ||
        !whatsappNumber ||
        !color
    ){

        alert("Please fill all information.");
        return;
    }


    const petId = generatePetID();

    const pet = {
        petId,
        petType,
        petName,
        ownerName,
        callNumber,
        whatsappNumber,
        color
    };


    /* Save locally */
    localStorage.setItem(
        "pet_" + petId,
        JSON.stringify(pet)
    );


    showQR(pet);
}


/* =========================
   SHOW QR
========================= */

function showQR(pet){

    document.getElementById("registrationSection")
        .classList.add("hidden");

    document.getElementById("searchSection")
        .classList.add("hidden");

    document.getElementById("foundSection")
        .classList.add("hidden");

    document.getElementById("qrSection")
        .classList.remove("hidden");


    document.getElementById("petIdDisplay").innerHTML =
        "<strong>Pet ID: " + escapeHTML(pet.petId) + "</strong>";


    const qrBox =
        document.getElementById("qrcode");

    qrBox.innerHTML = "";


    /*
       QR URL contains pet information,
       so scanning works even on another phone.
    */

    const currentUrl =
        window.location.origin +
        window.location.pathname +
        "?pet=" + encodeURIComponent(pet.petId) +
        "&type=" + encodeURIComponent(pet.petType) +
        "&name=" + encodeURIComponent(pet.petName) +
        "&owner=" + encodeURIComponent(pet.ownerName) +
        "&call=" + encodeURIComponent(pet.callNumber) +
        "&wa=" + encodeURIComponent(pet.whatsappNumber) +
        "&color=" + encodeURIComponent(pet.color);


    new QRCode(qrBox,{
        text:currentUrl,
        width:220,
        height:220,
        correctLevel:QRCode.CorrectLevel.H
    });


    document.getElementById("registeredInfo").innerHTML = `
        <p><strong>Pet ID:</strong> ${escapeHTML(pet.petId)}</p>
        <p><strong>Pet Type:</strong> ${escapeHTML(pet.petType)}</p>
        <p><strong>Pet Name:</strong> ${escapeHTML(pet.petName)}</p>
        <p><strong>Owner:</strong> ${escapeHTML(pet.ownerName)}</p>
        <p><strong>Color:</strong> ${escapeHTML(pet.color)}</p>
    `;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   BACK BUTTON
========================= */

function backToMenu(){

    document.getElementById("qrSection")
        .classList.add("hidden");

    document.getElementById("foundSection")
        .classList.add("hidden");

    document.getElementById("registrationSection")
        .classList.remove("hidden");

    document.getElementById("searchSection")
        .classList.remove("hidden");


    document.getElementById("qrcode").innerHTML = "";

    document.getElementById("registeredInfo").innerHTML = "";

    document.getElementById("searchMessage").textContent = "";

    document.getElementById("registerMessage").textContent = "";


    /* Clear registration form */
    document.getElementById("petName").value = "";
    document.getElementById("ownerName").value = "";
    document.getElementById("callNumber").value = "";
    document.getElementById("whatsappNumber").value = "";
    document.getElementById("petColor").value = "";


    /* Remove QR query from URL */
    history.replaceState(
        {},
        document.title,
        window.location.pathname
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   SEARCH PET
========================= */

function findPet(){

    const id =
        document.getElementById("searchId")
        .value.trim()
        .toUpperCase();

    const data =
        localStorage.getItem("pet_" + id);

    if(!data){

        const lang =
            document.getElementById("languageSelect").value;

        document.getElementById("searchMessage").textContent =
            translations[lang].notFound;

        return;
    }


    const pet = JSON.parse(data);

    showFoundPet(pet);
}


/* =========================
   FOUND PET
========================= */

function showFoundPet(pet){

    document.getElementById("registrationSection")
        .classList.add("hidden");

    document.getElementById("searchSection")
        .classList.add("hidden");

    document.getElementById("qrSection")
        .classList.add("hidden");

    document.getElementById("foundSection")
        .classList.remove("hidden");


    document.getElementById("foundInfo").innerHTML = `

        <div class="info-row">
            <strong>Pet ID:</strong>
            ${escapeHTML(pet.petId)}
        </div>

        <div class="info-row">
            <strong>Pet Type:</strong>
            ${escapeHTML(pet.petType)}
        </div>

        <div class="info-row">
            <strong>Pet Name:</strong>
            ${escapeHTML(pet.petName)}
        </div>

        <div class="info-row">
            <strong>Owner:</strong>
            ${escapeHTML(pet.ownerName)}
        </div>

        <div class="info-row">
            <strong>Color:</strong>
            ${escapeHTML(pet.color)}
        </div>

    `;


    window.currentFoundPet = pet;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   QR SCAN
========================= */

function showFoundPetFromQR(){

    const params =
        new URLSearchParams(window.location.search);

    const petId =
        params.get("pet");

    if(!petId) return;


    const pet = {

        petId:petId,

        petType:params.get("type") || "",

        petName:params.get("name") || "",

        ownerName:params.get("owner") || "",

        callNumber:params.get("call") || "",

        whatsappNumber:params.get("wa") || "",

        color:params.get("color") || ""

    };


    showFoundPet(pet);
}


/* =========================
   CALL OWNER
========================= */

function callOwner(){

    if(!window.currentFoundPet) return;

    const number =
        window.currentFoundPet.callNumber;

    window.location.href =
        "tel:" + number;
}


/* =========================
   WHATSAPP OWNER
========================= */

function whatsappOwner(){

    if(!window.currentFoundPet) return;

/* =========================
   SAVE INFORMATION
========================= */

async function saveInformation(){

    const petId =
        document.getElementById("petIdDisplay")
        .textContent
        .replace("Pet ID:","")
        .trim();

    const data =
        localStorage.getItem("pet_" + petId);

    if(!data) return;

    const pet = JSON.parse(data);


    const canvas =
        document.createElement("canvas");

    canvas.width = 900;
    canvas.height = 1050;

    const ctx =
        canvas.getContext("2d");


    /* Background */
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,900,1050);


    /* Title */
    ctx.fillStyle = "#332a24";
    ctx.textAlign = "center";

    ctx.font = "bold 48px Arial";

    ctx.fillText(
        "🐾 Find My Pet",
        450,
        80
    );


    ctx.font = "bold 34px Arial";

    ctx.fillText(
        "Pet Information",
        450,
        135
    );


    ctx.textAlign = "left";

    ctx.font = "bold 30px Arial";


    let y = 230;


    const lines = [

        ["Pet ID",pet.petId],

        ["Pet Type",pet.petType],

        ["Pet Name",pet.petName],

        ["Owner Name",pet.ownerName],

        ["Call Number",pet.callNumber],

        ["WhatsApp",pet.whatsappNumber],

        ["Pet Color",pet.color]

    ];


    lines.forEach(item=>{

        ctx.fillStyle = "#332a24";

        ctx.fillText(
            item[0] + ":",
            80,
            y
        );

        ctx.font = "28px Arial";

        ctx.fillText(
            item[1],
            80,
            y + 42
        );

        ctx.font = "bold 30px Arial";

        y += 110;

    });


    ctx.textAlign = "center";

    ctx.font = "22px Arial";

    ctx.fillText(
        "Scan the QR code to contact the owner.",
        450,
        980
    );


    const blob =
        await canvasToBlob(canvas);


    const file =
        new File(
            [blob],
            pet.petId + "-information.png",
            {type:"image/png"}
        );


    await shareOrDownload(
        file,
        blob,
        pet.petId + "-information.png",
        "Find My Pet Information"
    );
}


/* =========================
   SAVE QR
========================= */

async function saveQRToGallery(){

    const qrCanvas =
        document.querySelector("#qrcode canvas");

    if(!qrCanvas){

        alert("QR code is not ready.");
        return;
    }


    const canvas =
        document.createElement("canvas");

    canvas.width = 800;
    canvas.height = 900;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle = "#332a24";

    ctx.textAlign = "center";

    ctx.font = "bold 42px Arial";

    ctx.fillText(
        "🐾 Find My Pet",
        400,
        70
    );


    ctx.font = "bold 28px Arial";

    ctx.fillText(
        document.getElementById("petIdDisplay").textContent,
        400,
        120
    );


    ctx.drawImage(
        qrCanvas,
        150,
        180,
        500,
        500
    );


    ctx.font = "22px Arial";

    ctx.fillText(
        "Scan to contact the owner",
        400,
        750
    );


    const blob =
        await canvasToBlob(canvas);


    const file =
        new File(
            [blob],
            "Find-My-Pet-QR.png",
            {type:"image/png"}
        );


    await shareOrDownload(
        file,
        blob,
        "Find-My-Pet-QR.png",
        "Find My Pet QR Code"
    );
}


/* =========================
   SHARE / DOWNLOAD
========================= */

async function shareOrDownload(
    file,
    blob,
    filename,
    title
){

    try{

        /*
          Android + iPhone:
          Share sheet will appear if supported.
          User can select Gallery/Photos/Save/Download.
        */

        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                files:[file],

                title:title,

                text:title

            });

            return;
        }

    }catch(error){

        console.log(error);

    }


    /*
       Browser fallback
    */

    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download = filename;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },1000);

}


/* =========================
   CANVAS TO BLOB
========================= */

function canvasToBlob(canvas){

    return new Promise(resolve=>{

        canvas.toBlob(
            blob=>resolve(blob),
            "image/png"
        );

    });
}


/* =========================
   PRINT QR
========================= */

function printQR(){

    const qrCanvas =
        document.querySelector("#qrcode canvas");

    if(!qrCanvas) return;


    const image =
        qrCanvas.toDataURL("image/png");


    const petId =
        document.getElementById("petIdDisplay")
        .textContent;


    const printWindow =
        window.open("","_blank");


    printWindow.document.write(`

        <html>

        <head>

            <title>Find My Pet QR</title>

            <style>

                body{
                    text-align:center;
                    font-family:Arial;
                    padding:40px;
                }

                img{
                    width:300px;
                    height:300px;
                }

                h1{
                    margin-bottom:10px;
                }

            </style>

        </head>

        <body>

            <h1>🐾 Find My Pet</h1>

            <h2>${escapeHTML(petId)}</h2>

            <img src="${image}">

            <p>
                Scan this QR code to contact the owner.
            </p>

        </body>

        </html>

    `);


    printWindow.document.close();

    printWindow.focus();

    setTimeout(()=>{
        printWindow.print();
    },500);
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
