        textarea {

    document.getElementById("searchWhatsApp").innerHTML =
        t.whatsapp;


    document.getElementById("searchPrivacy").innerHTML =
        t.addressPrivate;


    document.documentElement.dir =
        currentLanguage === "ur" ||
        currentLanguage === "ar"
            ? "rtl"
            : "ltr";

}



/* =========================
   PET ID
========================= */


function generatePetID() {

    let characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let result =
        "FMP-";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        result +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

    }


    return result;

}



/* =========================
   SAVE PET
========================= */


function saveProfile() {

    let type =
        document.getElementById("petType").value;


    let pet =
        document.getElementById("petName").value.trim();


    let owner =
        document.getElementById("ownerName").value.trim();


    let phone =
        document.getElementById("phone").value.trim();


    let address =
        document.getElementById("address").value.trim();


    let color =
        document.getElementById("petColor").value.trim();


    let breed =
        document.getElementById("petBreed").value.trim();


    let t =
        languages[currentLanguage];


    if (
        type === "" ||
        pet === "" ||
        owner === "" ||
        phone === ""
    ) {

        alert(t.required);

        return;

    }


    let petID =
        generatePetID();


    let petData = {

        id: petID,

        type: type,

        pet: pet,

        owner: owner,

        phone: phone,

        address: address,

        color: color,

        breed: breed

    };


    /* SAVE IN BROWSER */

    let pets =
        JSON.parse(
            localStorage.getItem("findMyPets")
        ) || [];


    pets.push(petData);


    localStorage.setItem(
        "findMyPets",
        JSON.stringify(pets)
    );


    /* SHOW PROFILE */


    document.getElementById("showID").innerHTML =
        t.petID + petID;


    document.getElementById("showType").innerHTML =
        t.petType + type;


    document.getElementById("showPet").innerHTML =
        t.pet + pet;


    document.getElementById("showOwner").innerHTML =
        t.owner + owner;


    document.getElementById("showPhone").innerHTML =
        t.phoneShow + phone;


    document.getElementById("showAddress").innerHTML =
        t.addressShow +
        (address || t.notProvided);


    document.getElementById("showColor").innerHTML =
        t.colorShow +
        (color || t.notProvided);


    document.getElementById("showBreed").innerHTML =
        t.breedShow +
        (breed || t.notProvided);


    document.getElementById("profile").style.display =
        "block";


    /* CREATE QR */


    let baseURL =
        window.location.origin +
        window.location.pathname;


    let qrData =
        baseURL +
        "?id=" +
        encodeURIComponent(petID) +
        "&type=" +
        encodeURIComponent(type) +
        "&pet=" +
        encodeURIComponent(pet) +
        "&owner=" +
        encodeURIComponent(owner) +
        "&phone=" +
        encodeURIComponent(phone) +
        "&color=" +
        encodeURIComponent(color) +
        "&breed=" +
        encodeURIComponent(breed);


    document.getElementById("qrcode").innerHTML =
        "";


    new QRCode(

        document.getElementById("qrcode"),

        {

            text: qrData,

            width: 180,

            height: 180

        }

    );


    alert(
        t.petID + petID
    );

}



/* =========================
   FIND PET BY ID
========================= */


function findPet() {

    let searchID =
        document
        .getElementById("searchID")
        .value
        .trim()
        .toUpperCase();


    let t =
        languages[currentLanguage];


    document.getElementById("searchMessage").innerHTML =
        "";


    if (searchID === "") {

        document.getElementById("searchMessage").innerHTML =
            t.searchID;

        return;

    }


    let pets =
        JSON.parse(
            localStorage.getItem("findMyPets")
        ) || [];


    let pet =
        pets.find(
            item =>
            item.id.toUpperCase() === searchID
        );


    if (!pet) {

        document.getElementById("searchResult").style.display =
            "none";


        document.getElementById("searchMessage").innerHTML =
            t.noPet;


        return;

    }


    document.getElementById("searchResult").style.display =
        "block";


    document.getElementById("searchIDResult").innerHTML =
        t.petID + pet.id;


    document.getElementById("searchType").innerHTML =
        t.petType + pet.type;


    document.getElementById("searchPet").innerHTML =
        t.pet + pet.pet;


    document.getElementById("searchColor").innerHTML =
        t.colorShow +
        (pet.color || t.notProvided);


    document.getElementById("searchBreed").innerHTML =
        t.breedShow +
        (pet.breed || t.notProvided);


    /* CALL */

    document.getElementById("searchCall").onclick =
        function() {

            window.location.href =
                "tel:" + pet.phone;

        };


    /* WHATSAPP */

    document.getElementById("searchWhatsApp").onclick =
        function() {

            let number =
                pet.phone.replace(/\D/g, "");


            if (
                number.startsWith("0")
            ) {

                number =
                    "92" +
                    number.substring(1);

            }


            window.open(
                "https://wa.me/" +
                number,
                "_blank"
            );

        };

}
