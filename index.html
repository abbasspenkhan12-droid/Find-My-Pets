<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f1eb;
    color:#332a24;
}

.container{
    max-width:500px;
    margin:auto;
    padding:18px;
}


/* =========================
   TOP BAR
========================= */

.top-bar{
    width:100%;
    height:42px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.back-button,
.language-select{
    height:38px;
    margin:0 !important;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e0d4ca;
    border-radius:10px;
    background:white;
    color:#222;
    font-size:13px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.back-button{
    width:auto;
    cursor:pointer;
}

.language-select{
    width:auto;
    outline:none;
    cursor:pointer;
}


/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:5px 0;
    font-size:30px;
}

.header p{
    margin:0;
    font-size:14px;
    color:#75685e;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(76,48,29,.08);
    margin-bottom:18px;
}

.card h2{
    margin-top:0;
    font-size:21px;
}


/* =========================
   FORM
========================= */

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd0c5;
    border-radius:10px;
    font-size:15px;
    background:white;
    color:#222;
    outline:none;
}

select{
    color:#222 !important;
}

input:focus,
select:focus{
    border-color:#8d6e58;
}


/* =========================
   BUTTONS
========================= */

button{
    width:100%;
    border:0;
    padding:13px;
    border-radius:11px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:14px;
}

.primary{
    background:#332a24;
    color:white;
}

.secondary{
    background:#eee5dd;
    color:#332a24;
}

.call-btn{
    background:#e9f5e9;
    color:#205c28;
}

.whatsapp-btn{
    background:#e4f6e8;
    color:#176b2a;
}

.hidden{
    display:none !important;
}


/* =========================
   QR
========================= */

.qr-area{
    text-align:center;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin:20px 0;
}

.pet-info{
    background:#faf7f4;
    border-radius:14px;
    padding:15px;
    text-align:left;
}

.pet-info p{
    margin:8px 0;
}


/* =========================
   FOUND PET
========================= */

.found-title{

    font-size:23px;
    margin-bottom:15px;
}

.info-row{
    padding:9px 0;
    border-bottom:1px solid #eee5df;
}

.info-row:last-child{
    border-bottom:0;

/* =========================
   MESSAGE
========================= */

.message{
    text-align:center;
    font-size:14px;
    margin-top:10px;
    color:#76695f;

/* =========================
   RTL
========================= */

    text-align:right;

[dir="rtl"] .pet-info{
    text-align:right;

/*
IMPORTANT:
Back hamesha LEFT
Language hamesha RIGHT
Dono bilkul same line par.
*/

[dir="rtl"] .top-bar{

         SEARCH
    ========================= -->

        id="searchSection">

    ========================= -->

            <!-- SAVE QR -->

            <button

                🖼️ Save QR to Gallery

            </button>



            <!-- PRINT -->

            <button

            <!-- REGISTER ANOTHER -->

/* =====================================================

===================================================== */

function changeLanguage(){

    const lang =
        document.getElementById(
            "languageSelect"
        ).value;

    const t =
        translations[lang];


    document.documentElement.lang =
        lang;


    if(
        lang === "ur" ||
        lang === "ar"
    ){

        document.documentElement.dir =
            "rtl";

    }else{

        document.documentElement.dir =
            "ltr";

    }


    document.getElementById(
        "backButton"
    ).textContent =
        t.back;


    document.getElementById(
        "subtitle"

        t.subtitle;


    document.getElementById(

    document.getElementById(

        t.callOwner;


    document.getElementById(

    ).textContent =
        t.whatsappOwner;


    document.getElementById(
        "backFoundButton"
    ).textContent =
        t.back;


    /* PET TYPE OPTIONS */

    const petType =
        document.getElementById(
            "petType"
        );


    petType.options[0].text =
        t.selectPet;

    petType.options[1].text =
        t.cat;

    petType.options[2].text =
        t.dog;

    petType.options[3].text =
        t.rabbit;

    petType.options[4].text =
        t.bird;

    petType.options[5].text =
        t.other;
}


/* =====================================================
   GENERATE EASY PET ID
===================================================== */

function generatePetID(){

    let number =
        parseInt(
            localStorage.getItem(
                "fmpLastID"
            ) || "0"
        ) + 1;


    localStorage.setItem(
        "fmpLastID",
        number
    );


    return "FMP-" +
        String(number).padStart(
            3,
            "0"
        );
}


/* =====================================================
   REGISTER PET
===================================================== */

function registerPet(){

    /*
       ALL INFORMATION IS OPTIONAL.
       Registration works even if
       some or all fields are empty.
    */

    const petType =
        document.getElementById(
            "petType"
        ).value ||
        "Not specified";


    const petName =
        document.getElementById(
            "petName"
        ).value.trim();


    const ownerName =
        document.getElementById(
            "ownerName"
        ).value.trim();


    const callNumber =
        document.getElementById(
            "callNumber"
        ).value.trim();


    const whatsappNumber =
        document.getElementById(
            "whatsappNumber"
        ).value.trim();


    const color =
        document.getElementById(
            "petColor"
        ).value.trim();


    /*
       EASY PET ID
    */

    const petId =
        generatePetID();


    const pet = {

        petId:petId,

        petType:petType,

        petName:petName,

        ownerName:ownerName,

        callNumber:callNumber,

        whatsappNumber:whatsappNumber,

        color:color

    };


    /*
       SAVE PET
    */

    localStorage.setItem(
        "pet_" + petId,
        JSON.stringify(pet)
    );


    /*
       SHOW QR
    */

    showQR(pet);
}


/* =====================================================
   SHOW QR
===================================================== */

function showQR(pet){

    document.getElementById(
        "registrationSection"
    ).classList.add("hidden");


    document.getElementById(
        "searchSection"
    ).classList.add("hidden");


    document.getElementById(
        "foundSection"
    ).classList.add("hidden");


    document.getElementById(
        "qrSection"
    ).classList.remove("hidden");


    document.getElementById(
        "petIdDisplay"
    ).innerHTML =
        "<strong>Pet ID: " +
        escapeHTML(pet.petId) +
        "</strong>";


    const qrBox =
        document.getElementById(
            "qrcode"
        );


    qrBox.innerHTML = "";


    const currentUrl =

        window.location.origin +

        window.location.pathname +

        "?pet=" +
        encodeURIComponent(
            pet.petId
        ) +

        "&type=" +
        encodeURIComponent(
            pet.petType
        ) +

        "&name=" +
        encodeURIComponent(
            pet.petName
        ) +

        "&owner=" +
        encodeURIComponent(
            pet.ownerName
        ) +

        "&call=" +
        encodeURIComponent(
            pet.callNumber
        ) +

        );


    const petId =

    if(!petId){

        return;

    }


    const pet = {

            "Not specified",

        petName:

        ownerName:
            params.get("owner") ||
            "",

        callNumber:
            params.get("call") ||
            "",

        whatsappNumber:
            params.get("wa") ||
            "",

        color:
            params.get("color") ||
            ""

    };


    showFoundPet(pet);
}


/* =====================================================
   CALL OWNER
===================================================== */

function callOwner(){

    if(
        !window.currentFoundPet
    ){

        return;

    }


    const number =
        window.currentFoundPet
        .callNumber;


    if(!number){

        return;

    }


    window.location.href =
        "tel:" + number;
}


/* =====================================================
   WHATSAPP OWNER
===================================================== */

function whatsappOwner(){

    if(
        !window.currentFoundPet
    ){

        return;

    }


    let number =
        window.currentFoundPet
        .whatsappNumber;


    if(!number){

        return;

    }


    number =
        number.replace(
            /\D/g,
            ""
        );


    if(
        number.startsWith("0")
    ){

        number =
            "92" +
            number.substring(1);

    }


    window.open(

        "https://wa.me/" +
        number,

        "_blank"

    );
}

/* =====================================================
   SHARE OR DOWNLOAD
===================================================== */

async function shareOrDownload(

    file,
    blob,
    filename,
    title

){

    try{

        if(

            navigator.share &&

            navigator.canShare &&

            navigator.canShare({

                files:[file]

            })

        ){

            await navigator.share({

                files:[file],

                title:title,

                text:title

            });


            return;

        }

    }catch(error){

        console.log(error);

    }


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(

        ()=>{

            URL.revokeObjectURL(
                url
            );

        },

        1000

    );

}


/* =====================================================
   CANVAS TO BLOB
===================================================== */

function canvasToBlob(canvas){

    return new Promise(

        resolve=>{

            canvas.toBlob(

                blob=>resolve(blob),

                "image/png"

            );

        }

    );

}

/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
