<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find My Pet</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f7f3ef;
    color:#332a24;
}

.container{
    max-width:500px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin-top:8px;
    color:#666;
    font-size:14px;
}

/* TOP BAR */

.top-bar{
    width:100%;
    height:42px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.back-button,
.language-select{
    height:38px;
    margin:0 !important;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e0d4ca;
    border-radius:10px;
    background:white;
    color:#222;
    font-size:13px;
    font-weight:bold;
}

.back-button{
    width:auto;
    cursor:pointer;
}

.language-select{
    width:auto;
    cursor:pointer;
}

/* CARD */

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:18px;
}

h2{
    margin-top:0;
    font-size:20px;
}

label{
    display:block;
    margin-top:13px;
    margin-bottom:6px;
    font-size:14px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    color:#222;
    font-size:14px;
}

select{
    color:#222 !important;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:13px;
    margin-top:15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    background:#332a24;
    color:white;
}

.action-btn{
    background:#f0e8e1;
    color:#332a24;
}

.call-btn{
    background:#e9f7e9;
    color:#237523;
}

.whatsapp-btn{
    background:#e8f7ee;
    color:#16833b;
}

.hidden{
    display:none !important;
}

.pet-info{
    line-height:1.8;
    font-size:15px;
}

.pet-id{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin:20px 0;
}

#qrcode img{
    border:10px solid white;
}

.success{
    text-align:center;
    font-weight:bold;
    margin-bottom:10px;
}

.small-note{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Find My Pet</h1>
        <p id="mainDescription">
            Register your pet and get a QR code to help find them.
        </p>
    </div>


    <!-- TOP BAR -->
    <div class="top-bar">

        <button
            class="back-button"
            id="backButton"
            onclick="backToMenu()">
            ← Back
        </button>

        <select
            class="language-select"
            id="languageSelect"
            onchange="changeLanguage()">

            <option value="en">English</option>
            <option value="ur">اردو</option>
            <option value="ar">العربية</option>
            <option value="ru">Русский</option>
            <option value="ky">Кыргызча</option>

        </select>

    </div>


    <!-- REGISTRATION SCREEN -->

    <div id="registrationScreen" class="card">

        <h2 id="registerTitle">
            Register Your Pet
        </h2>

        <p id="registerText">
            Enter your pet information below.
        </p>


        <label id="petTypeLabel">
            Pet Type
        </label>

        <select id="petType">

            <option value="" selected disabled>
                Select Pet Type
            </option>

            <option value="Cat">
                Cat
            </option>

            <option value="Dog">
                Dog
            </option>

            <option value="Rabbit">
                Rabbit
            </option>

            <option value="Bird">
                Bird
            </option>

            <option value="Other Pet">
                Other Pet
            </option>

        </select>


        <label id="petNameLabel">
            Pet Name
        </label>

        <input
            type="text"
            id="petName"
            placeholder="Enter pet name">


        <label id="ownerNameLabel">
            Owner Name
        </label>

        <input
            type="text"
            id="ownerName"
            placeholder="Enter owner name">


        <label id="callNumberLabel">
            Normal SIM / Call Number
        </label>

        <input
            type="tel"
            id="callNumber"
            placeholder="Enter number for calls">


        <label id="whatsappNumberLabel">
            WhatsApp Number
        </label>

        <input
            type="tel"
            id="whatsappNumber"
            placeholder="Enter WhatsApp number">


        <label id="petColorLabel">
            Pet Color
        </label>

        <input
            type="text"
            id="petColor"
            placeholder="Enter pet color">


        <button
            class="register-btn"
            onclick="registerPet()"
            id="registerButton">
            Register Pet & Generate QR
        </button>

        <p class="small-note" id="optionalText">
            All information is optional.
        </p>

    </div>


    <!-- QR SCREEN -->

    <div id="qrScreen" class="card hidden">

        <div class="success" id="successText">
            Pet Registered Successfully!
        </div>

        <div class="pet-id">
            <span id="petIdLabel">Pet ID:</span>
            <span id="petId"></span>
        </div>

        <div id="qrcode"></div>

        <div class="pet-info" id="petInfo"></div>


        <button
            class="call-btn"
            id="callButton"
            onclick="callOwner()">
            📞 Call Owner
        </button>


        <button
            class="whatsapp-btn"
            id="whatsappButton"
            onclick="whatsappOwner()">
            💬 WhatsApp Owner
        </button>


        <button
            class="action-btn"
            onclick="saveInformation()"
            id="saveInfoButton">
            💾 Save Information
        </button>


        <button
            class="action-btn"
            onclick="saveQRToGallery()"
            id="saveQRButton">
            🖼️ Save QR to Gallery
        </button>


        <button
            class="action-btn"
            onclick="printQR()"
            id="printButton">
            🖨️ Print QR
        </button>

    </div>


    <!-- FOUND PET SCREEN -->

    <div id="foundPetScreen" class="card hidden">

        <h2 id="foundTitle">
            Pet Found
        </h2>

        <div class="pet-info" id="foundPetInfo"></div>


        <button
            class="call-btn"
            onclick="foundCallOwner()"
            id="foundCallButton">
            📞 Call Owner
        </button>


        <button
            class="whatsapp-btn"
            onclick="foundWhatsappOwner()"
            id="foundWhatsappButton">
            💬 WhatsApp Owner
        </button>

    </div>

</div>


<script>

/* =========================
   PET ID
========================= */

function generatePetID(){

    let number =
        parseInt(
            localStorage.getItem("fmpLastID") || "0"
        ) + 1;

    localStorage.setItem(
        "fmpLastID",
        number
    );

    return "FMP-" +
        String(number).padStart(3,"0");
}


/* =========================
   REGISTER PET
========================= */

function registerPet(){

    const petType =
        document.getElementById("petType").value ||
        "Not specified";

    const petName =
        document.getElementById("petName")
        .value.trim();

    const ownerName =
        document.getElementById("ownerName")
        .value.trim();

    const callNumber =
        document.getElementById("callNumber")
        .value.trim();

    const whatsappNumber =
        document.getElementById("whatsappNumber")
        .value.trim();

    const color =
        document.getElementById("petColor")
        .value.trim();


    const petId =
        generatePetID();


    const pet = {

        petId: petId,

        petType: petType,

        petName: petName,

        ownerName: ownerName,

        callNumber: callNumber,

        whatsappNumber: whatsappNumber,

        color: color

    };


    localStorage.setItem(
        "pet_" + petId,
        JSON.stringify(pet)
    );


    showQR(pet);
}


/* =========================
   SHOW QR
========================= */

function showQR(pet){

    document.getElementById(
        "registrationScreen"
    ).classList.add("hidden");

    document.getElementById(
        "foundPetScreen"
    ).classList.add("hidden");

    document.getElementById(
        "qrScreen"
    ).classList.remove("hidden");


    document.getElementById(
        "petId"
    ).textContent = pet.petId;


    const qrBox =
        document.getElementById("qrcode");

    qrBox.innerHTML = "";


    const baseURL =
        window.location.origin +
        window.location.pathname;


    const qrURL =
        baseURL +
        "?pet=" +
        encodeURIComponent(pet.petId) +

        "&type=" +
        encodeURIComponent(pet.petType) +

        "&name=" +
        encodeURIComponent(pet.petName) +

        "&owner=" +
        encodeURIComponent(pet.ownerName) +

        "&call=" +
        encodeURIComponent(pet.callNumber) +

        "&wa=" +
        encodeURIComponent(pet.whatsappNumber) +

        "&color=" +
        encodeURIComponent(pet.color);


    new QRCode(
        qrBox,
        {
            text: qrURL,
            width:220,
            height:220,
            correctLevel:QRCode.CorrectLevel.H
        }
    );


    document.getElementById(
        "petInfo"
    ).innerHTML = createPetInfoHTML(pet);


    document.getElementById(
        "callButton"
    ).style.display =
        pet.callNumber ? "block" : "none";


    document.getElementById(
        "whatsappButton"
    ).style.display =
        pet.whatsappNumber ? "block" : "none";
}


/* =========================
   PET INFORMATION
========================= */

function createPetInfoHTML(pet){

    return `

        <strong>Pet Type:</strong>
        ${escapeHTML(pet.petType || "Not specified")}
        <br>

        <strong>Pet Name:</strong>
        ${escapeHTML(pet.petName || "Not specified")}
        <br>

        <strong>Owner Name:</strong>
        ${escapeHTML(pet.ownerName || "Not specified")}
        <br>

        <strong>Call Number:</strong>
        ${escapeHTML(pet.callNumber || "Not specified")}
        <br>

        <strong>WhatsApp:</strong>
        ${escapeHTML(pet.whatsappNumber || "Not specified")}
        <br>

        <strong>Pet Color:</strong>
        ${escapeHTML(pet.color || "Not specified")}

    `;
}


function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;
}


/* =========================
   CALL OWNER
========================= */

function callOwner(){

    const petId =
        document.getElementById(
            "petId"
        ).textContent;

    const data =
        localStorage.getItem(
            "pet_" + petId
        );

    if(!data){
        alert("Phone number not available.");
        return;
    }

    const pet =
        JSON.parse(data);

    if(!pet.callNumber){
        alert("Phone number not available.");
        return;
    }

    window.location.href =
        "tel:" + pet.callNumber;
}


/* =========================
   WHATSAPP OWNER
========================= */

function whatsappOwner(){

    const petId =
        document.getElementById(
            "petId"
        ).textContent;

    const data =
        localStorage.getItem(
            "pet_" + petId
        );

    if(!data){
        alert("WhatsApp number not available.");
        return;
    }

    const pet =
        JSON.parse(data);

    if(!pet.whatsappNumber){
        alert("WhatsApp number not available.");
        return;
    }


    let number =
        pet.whatsappNumber
        .replace(/\D/g,"");


    if(
        number.startsWith("0")
    ){
        number =
            "92" +
            number.substring(1);
    }


    window.open(
        "https://wa.me/" + number,
        "_blank"
    );
}


/* =========================
   QR SCAN DETECTION
========================= */

function showFoundPetFromQR(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const petId =
        params.get("pet");


    if(!petId){
        return;
    }


    const pet = {

        petId: petId,

        petType:
            params.get("type") ||
            "Not specified",

        petName:
            params.get("name") ||
            "",

        ownerName:
            params.get("owner") ||
            "",

        callNumber:
            params.get("call") ||
            "",

        whatsappNumber:
            params.get("wa") ||
            "",

        color:
            params.get("color") ||
            ""

    };


    document.getElementById(
        "registrationScreen"
    ).classList.add("hidden");


    document.getElementById(
        "qrScreen"
    ).classList.add("hidden");


    document.getElementById(
        "foundPetScreen"
    ).classList.remove("hidden");


    document.getElementById(
        "foundPetInfo"
    ).innerHTML = `

        <div class="pet-id">
            Pet ID: ${escapeHTML(pet.petId)}
        </div>

        ${createPetInfoHTML(pet)}

    `;


    window.currentFoundPet =
        pet;


    document.getElementById(
        "foundCallButton"
    ).style.display =
        pet.callNumber ? "block" : "none";


    document.getElementById(
        "foundWhatsappButton"
    ).style.display =
        pet.whatsappNumber ? "block" : "none";
}


/* =========================
   FOUND PET CALL
========================= */

function foundCallOwner(){

    const pet =
        window.currentFoundPet;

    if(
        !pet ||
        !pet.callNumber
    ){
        alert("Phone number not available.");
        return;
    }

    window.location.href =
        "tel:" + pet.callNumber;
}


/* =========================
   FOUND PET WHATSAPP
========================= */

function foundWhatsappOwner(){

    const pet =
        window.currentFoundPet;

    if(
        !pet ||
        !pet.whatsappNumber
    ){
        alert("WhatsApp number not available.");
        return;
    }


    let number =
        pet.whatsappNumber
        .replace(/\D/g,"");


    if(
        number.startsWith("0")
    ){
        number =
            "92" +
            number.substring(1);
    }


    window.open(
        "https://wa.me/" + number,
        "_blank"
    );
}


/* =========================
   SAVE INFORMATION
========================= */

async function saveInformation(){

    const petId =
        document.getElementById(
            "petId"
        ).textContent;

    const data =
        localStorage.getItem(
            "pet_" + petId
        );

    if(!data){
        alert("Information not found.");
        return;
    }

    const pet =
        JSON.parse(data);


    const canvas =
        document.createElement("canvas");

    canvas.width = 900;
    canvas.height = 700;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#332a24";

    ctx.font =
        "bold 42px Arial";

    ctx.fillText(
        "Find My Pet",
        50,70
    );


    ctx.font =
        "bold 28px Arial";

    ctx.fillText(
        "Pet ID: " + pet.petId,
        50,130
    );


    ctx.font =
        "24px Arial";


    const lines = [

        "Pet Type: " +
        (pet.petType || "Not specified"),

        "Pet Name: " +
        (pet.petName || "Not specified"),

        "Owner Name: " +
        (pet.ownerName || "Not specified"),

        "Call Number: " +
        (pet.callNumber || "Not specified"),

        "WhatsApp: " +
        (pet.whatsappNumber || "Not specified"),

        "Pet Color: " +
        (pet.color || "Not specified")

    ];


    lines.forEach(
        (line,index)=>{

            ctx.fillText(
                line,
                50,
                190 + index*55
            );

        }
    );


    const blob =
        await new Promise(
            resolve =>
                canvas.toBlob(resolve,"image/png")
        );


    const file =
        new File(
            [blob],
            "Find-My-Pet-" +
            pet.petId +
            ".png",
            {
                type:"image/png"
            }
        );


    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({files:[file]})
    ){

        try{

            await navigator.share({
                files:[file],
                title:"Find My Pet"
            });

            return;

        }catch(e){}

    }


    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "Find-My-Pet-" +
        pet.petId +
        ".png";

    link.click();

}


/* =========================
   SAVE QR
========================= */

async function saveQRToGallery(){

    const qrCanvas =
        document.querySelector(
            "#qrcode canvas"
        );


    const qrImage =
        document.querySelector(
            "#qrcode img"
        );


    let source =
        qrCanvas || qrImage;


    if(!source){
        alert("QR code not ready.");
        return;
    }


    const canvas =
        document.createElement("canvas");

    canvas.width = 700;
    canvas.height = 800;


    const ctx =
        canvas.getContext("2d");


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#332a24";

    ctx.font =
        "bold 42px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "Find My Pet",
        350,
        70
    );


    ctx.font =
        "bold 30px Arial";


    ctx.fillText(
        "Pet ID: " +
        document.getElementById(
            "petId"
        ).textContent,
        350,
        120
    );


    ctx.drawImage(
        source,
        150,
        170,
        400,
        400
    );


    ctx.font =
        "22px Arial";


    ctx.fillText(
        "Scan this QR code to find the pet owner",
        350,
        630
    );


    const blob =
        await new Promise(
            resolve =>
                canvas.toBlob(resolve,"image/png")
        );


    const petId =
        document.getElementById(
            "petId"
        ).textContent;


    const file =
        new File(
            [blob],
            "Find-My-Pet-QR-" +
            petId +
            ".png",
            {
                type:"image/png"
            }
        );


    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({files:[file]})
    ){

        try{

            await navigator.share({
                files:[file],
                title:"Find My Pet QR"
            });

            return;

        }catch(e){}

    }


    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "Find-My-Pet-QR-" +
        petId +
        ".png";

    link.click();
}


/* =========================
   PRINT QR
========================= */

function printQR(){

    const qr =
        document.getElementById(
            "qrcode"
        ).innerHTML;


    const petId =
        document.getElementById(
            "petId"
        ).textContent;


    const win =
        window.open(
            "",
            "_blank"
        );


    win.document.write(`

        <html>

        <head>

            <title>
                Find My Pet - ${petId}
            </title>

            <style>

                body{
                    text-align:center;
                    font-family:Arial;
                    padding:30px;
                }

                img{
                    width:300px;
                    height:300px;
                }

                h1{
                    margin-bottom:10px;
                }

            </style>

        </head>

        <body>

            <h1>Find My Pet</h1>

            <h2>Pet ID: ${petId}</h2>

            ${qr}

            <p>
                Scan this QR code to find the pet owner.
            </p>

            <script>

                window.onload=function(){
                    window.print();
                };

            <\/script>

        </body>

        </html>

    `);


    win.document.close();
}


/* =========================
   BACK BUTTON
========================= */

function backToMenu(){

    document.getElementById(
        "qrScreen"
    ).classList.add("hidden");


    document.getElementById(
        "foundPetScreen"
    ).classList.add("hidden");


    document.getElementById(
        "registrationScreen"
    ).classList.remove("hidden");


    document.getElementById(
        "petType"
    ).value = "";


    document.getElementById(
        "petName"
    ).value = "";


    document.getElementById(
        "ownerName"
    ).value = "";


    document.getElementById(
        "callNumber"
    ).value = "";


    document.getElementById(
        "whatsappNumber"
    ).value = "";


    document.getElementById(
        "petColor"
    ).value = "";


    document.getElementById(
        "qrcode"
    ).innerHTML = "";


    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );
}

/* =========================
   CHANGE LANGUAGE
========================= */

function changeLanguage(){

    const lang =
        document.getElementById(
            "languageSelect"
        ).value;

    const t =
        translations[lang];


    document.getElementById(
        "backButton"
    ).textContent =
        t.back;


    document.getElementById(
        "mainDescription"
    ).textContent =
        t.description;


    document.getElementById(
        "registerTitle"
    ).textContent =
        t.registerTitle;


    document.getElementById(
        "registerText"
    ).textContent =
        t.registerText;


    document.getElementById(
        "petTypeLabel"
    ).textContent =
        t.petType;


    const select =
        document.getElementById(
            "petType"
        );


    select.options[0].text =
        t.selectPet;

    select.options[1].text =
        t.cat;

    select.options[2].text =
        t.dog;

    select.options[3].text =
        t.rabbit;

    select.options[4].text =
        t.bird;

    select.options[5].text =
        t.other;


    document.getElementById(
        "petNameLabel"
    ).textContent =
        t.petName;


    document.getElementById(
        "ownerNameLabel"
    ).textContent =
        t.ownerName;


    document.getElementById(
        "callNumberLabel"
    ).textContent =
        t.callNumber;


    document.getElementById(
        "whatsappNumberLabel"
    ).textContent =
        t.whatsappNumber;


    document.getElementById(
        "petColorLabel"
    ).textContent =
        t.color;


    document.getElementById(
        "petName"
    ).placeholder =
        t.petNamePlaceholder;


    document.getElementById(
        "ownerName"
    ).placeholder =
        t.ownerPlaceholder;


    document.getElementById(
        "callNumber"
    ).placeholder =
        t.callPlaceholder;


    document.getElementById(
        "whatsappNumber"
    ).placeholder =
        t.whatsappPlaceholder;


    document.getElementById(
        "petColor"
    ).placeholder =
        t.colorPlaceholder;


    document.getElementById(
        "registerButton"
    ).textContent =
        t.register;


    document.getElementById(
        "optionalText"
    ).textContent =
        t.optional;


    document.getElementById(
        "successText"
    ).textContent =
        t.success;


    document.getElementById(
        "petIdLabel"
    ).textContent =
        t.petId;


    document.getElementById(
        "callButton"
    ).textContent =
        t.call;


    document.getElementById(
        "whatsappButton"
    ).textContent =
        t.whatsapp;


    document.getElementById(
        "saveInfoButton"
    ).textContent =
        t.saveInfo;


    document.getElementById(
        "saveQRButton"
    ).textContent =
        t.saveQR;


    document.getElementById(
        "printButton"
    ).textContent =
        t.print;


    document.getElementById(
        "foundTitle"
    ).textContent =
        t.found;


    if(
        lang === "ur" ||
        lang === "ar"
    ){

        document.documentElement
            .setAttribute(
                "dir",
                "rtl"
            );

    }else{

        document.documentElement
            .setAttribute(
                "dir",
                "ltr"
            );

    }
}
